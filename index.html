<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micron Laboratory - Inventory Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.hidden{display:none!important}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 5px 20px rgba(0,0,0,.06)}
.login-card{width:400px;padding:30px;text-align:center}.login-logo{width:230px;max-width:85%;height:auto;object-fit:contain;margin:0 auto 12px;display:block}
.login-card h2{margin:8px 0 4px}.login-card p{color:#64748b;margin:0 0 22px}label{display:block;text-align:left;font-size:13px;font-weight:600;margin-top:8px}
input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff}
button{border:0;border-radius:8px;padding:10px 15px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}button:hover{opacity:.92}button.gray{background:#e2e8f0;color:#1e293b}button.red{background:#dc2626}
header{min-height:72px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:8px 25px;gap:20px}
.header-brand{display:flex;align-items:center;gap:14px}.header-logo{width:150px;height:auto;max-height:55px;object-fit:contain}.header-title{border-left:1px solid #e2e8f0;padding-left:14px}.header-title h2{margin:0;font-size:19px}.header-title span{color:#64748b;font-size:13px}
.container{max-width:1400px;margin:auto;padding:25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px}.stat small{color:#64748b}.stat strong{display:block;font-size:28px;margin-top:8px}
.toolbar{display:flex;gap:10px;margin-bottom:20px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:450px;margin:0}.table-card{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:12px;border-bottom:1px solid #edf2f7;text-align:left;font-size:13px}th{background:#f8fafc}.action-btn{padding:6px 9px;font-size:12px;margin:2px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:15px;z-index:100}.modal-box{width:700px;max-width:100%;max-height:92vh;overflow:auto;padding:25px}.modal-header{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}
.message{margin-top:10px;color:#dc2626;font-size:13px}.success{color:#15803d}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.header-logo{width:120px}.header-title{display:none}}
@media(max-width:800px){.toolbar>div{min-width:100%!important}.toolbar button{width:100%}} 
.inventory-toolbar{display:grid;grid-template-columns:1.15fr 1.15fr .9fr 1.05fr 1.45fr auto;gap:12px;align-items:end;margin:18px 0 20px}
.filter-field label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#334155}
.filter-field input,.filter-field select{width:100%;height:40px;box-sizing:border-box;margin:0}
.filter-actions{display:flex;gap:8px;align-items:end;height:40px}
.filter-actions button{height:40px;white-space:nowrap}
.search-wrap{position:relative}
.search-suggestions{position:absolute;z-index:50;top:44px;left:0;right:0;background:#fff;border:1px solid #dbe2ea;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);max-height:260px;overflow-y:auto}
.search-suggestion{padding:10px 12px;border-bottom:1px solid #eef2f7;cursor:pointer}
.search-suggestion:last-child{border-bottom:0}
.search-suggestion:hover{background:#f1f5f9}
.search-suggestion small{display:block;color:#64748b;margin-top:2px}
@media(max-width:1150px){.inventory-toolbar{grid-template-columns:repeat(3,1fr)}.filter-actions{grid-column:1/-1}}
@media(max-width:700px){.inventory-toolbar{grid-template-columns:1fr}.filter-actions{grid-column:auto}.filter-actions button{flex:1}.search-suggestions{max-height:220px}}
</style>
</head>
<body>

<div id="loginPage" class="login-page"><div class="card login-card">
<img src="micron-logo.png" class="login-logo" alt="Micron Laboratory">
<h2>Inventory Admin</h2><p>Micron Laboratory</p>
<label>Email</label><input id="loginEmail" type="email" placeholder="Admin Email" autocomplete="username">
<label>Password</label><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
<button id="loginBtn" style="width:100%;">Login</button><div id="loginMessage" class="message"></div>
</div></div>

<div id="adminPage" class="hidden"><header><div class="header-brand">
<img src="micron-logo.png" class="header-logo" alt="Micron Laboratory">
<div class="header-title"><h2>Inventory Admin</h2><span>Stock Management</span></div>
</div><div style="display:flex;align-items:center;gap:10px"><span id="roleBadge" style="font-size:12px;background:#eef2ff;padding:7px 10px;border-radius:20px">Checking role...</span><button id="logoutBtn" class="gray">Logout</button></div></header>

<div class="container"><div class="stats">
<div class="stat"><small>Total Products</small><strong id="totalProducts">0</strong></div>
<div class="stat"><small>Total Stock</small><strong id="totalStock">0</strong></div>
<div class="stat"><small>Low Stock</small><strong id="lowStock">0</strong></div>
<div class="stat"><small>Expiring Soon</small><strong id="expiring">0</strong></div>
</div>

<div class="inventory-toolbar">
  <div class="filter-field"><label>Product Filter</label><select id="productFilter"><option value="">All Products</option></select></div>
  <div class="filter-field"><label>Batch / Lot</label><select id="batchFilter"><option value="">All Batches</option></select></div>
  <div class="filter-field"><label>Entry Date</label><input id="dateFilter" type="date"></div>
  <div class="filter-field"><label>Stock Status</label><select id="stockFilter"><option value="">All Stock</option><option value="in">In Stock</option><option value="low">Low Stock</option><option value="out">Out of Stock</option></select></div>
  <div class="filter-field search-field"><label>Search Product / Batch</label><div class="search-wrap"><input id="search" type="text" autocomplete="off" placeholder="Type TSH, E2, batch..."><div id="searchSuggestions" class="search-suggestions hidden"></div></div></div>
  <div class="filter-actions"><button id="clearFiltersBtn" class="gray">Clear Filters</button><button id="addProductBtn">+ Add Product</button></div>
</div>
<div class="card table-card"><table><thead><tr><th>Product</th><th>Batch / Lot</th><th>Entry Date</th><th>Expiry</th><th>Current Qty</th><th>Unit</th><th id="rateHeader">Rate</th><th>GST</th><th id="supplierHeader">Supplier</th><th>Actions</th></tr></thead><tbody id="inventoryBody"></tbody></table>
<div id="noData" style="text-align:center;padding:30px;color:#64748b;">No inventory found.</div></div></div></div>

<div id="productModal" class="modal hidden"><div class="card modal-box"><div class="modal-header"><h2 id="modalTitle">Add Product</h2><button id="closeProductModal" class="gray">×</button></div>
<form id="productForm"><input type="hidden" id="productId"><div class="grid">
<div><label>Product Name *</label><input id="productName" required></div><div><label>Description</label><input id="description"></div>
<div><label>Batch / Lot No. *</label><input id="batchNo" required></div><div><label>Entry Date *</label><input id="entryDate" type="date" required></div>
<div><label>Expiry Date</label><input id="expiryDate" type="date"></div><div><label>Current Qty *</label><input id="currentQty" type="number" min="0" step="0.01" required></div>
<div><label>Unit *</label><input id="unit" value="Kit" required></div><div><label>Units per Pack</label><input id="unitsPerPack" type="number" min="0"></div>
<div id="rateField"><label>Rate</label><input id="rate" type="number" min="0" step="0.01"></div><div><label>GST %</label><input id="gstPercent" type="number" min="0" max="100" step="0.01"></div>
<div id="supplierField"><label>Supplier *</label><input id="supplier"></div><div><label>Reorder Level</label><input id="reorderLevel" type="number" min="0"></div>
</div><div style="text-align:right;margin-top:15px"><button type="button" id="cancelProduct" class="gray">Cancel</button> <button type="submit">Save Product</button></div>
<div id="productMessage" class="message"></div></form></div></div>

<div id="stockModal" class="modal hidden"><div class="card modal-box" style="max-width:420px"><div class="modal-header"><h2 id="stockProductName">Stock</h2><button id="closeStockModal" class="gray">×</button></div>
<p>Batch / Lot: <strong id="stockBatchName"></strong></p><p>Current Stock: <strong id="currentStock">0</strong></p><label>Quantity</label><input id="movementQty" type="number" min="0.01" step="0.01" placeholder="Enter quantity">
<div style="display:flex;gap:10px;justify-content:flex-end"><button id="cancelStock" class="gray">Cancel</button><button id="outStock" class="red">OUT</button><button id="inStock">IN</button></div>
<div id="stockMessage" class="message"></div></div></div>

<script>
const SUPABASE_URL="https://xldnayhoquadguepedqm.supabase.co";
const SUPABASE_KEY="sb_publishable_EPC6EEnO2EEvcIQFtozteA_XTKMyPx1";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let inventory=[],selectedProduct=null,currentRole="operator";
const ROLE_PERMISSIONS={
admin:{viewSensitive:true,canAdd:true,canEdit:true,canDelete:true,canStock:true,canUsers:true},
manager:{viewSensitive:false,canAdd:true,canEdit:true,canDelete:false,canStock:true,canUsers:false},
operator:{viewSensitive:false,canAdd:true,canEdit:false,canDelete:false,canStock:true,canUsers:false}
};
const perms=()=>ROLE_PERMISSIONS[currentRole]||ROLE_PERMISSIONS.operator;

document.getElementById("loginBtn").addEventListener("click",async()=>{const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value,message=document.getElementById("loginMessage");message.innerText="";if(!email||!password){message.innerText="Email aur password enter karo.";return}const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){message.innerText=error.message;return}showAdmin()});
document.getElementById("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click()});
async function checkSession(){const {data}=await supabaseClient.auth.getSession();if(data.session)showAdmin();else showLogin()}
function showLogin(){document.getElementById("loginPage").classList.remove("hidden");document.getElementById("adminPage").classList.add("hidden")}
async function showAdmin(){document.getElementById("loginPage").classList.add("hidden");document.getElementById("adminPage").classList.remove("hidden");await loadRole();loadInventory();if(perms().canUsers)loadUsers();}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(session)showAdmin();else showLogin()});
document.getElementById("logoutBtn").addEventListener("click",async()=>{await supabaseClient.auth.signOut()});

async function loadRole(){
  const user=(await supabaseClient.auth.getUser()).data.user;
  const {data,error}=await supabaseClient.from("inventory_user_roles").select("role").eq("user_id",user.id).maybeSingle();
  if(error){console.error("Role load error:",error);alert("Role load nahi ho raha: "+error.message);currentRole="operator";}
  else if(data&&ROLE_PERMISSIONS[data.role]) currentRole=data.role;
  else {currentRole="operator";console.warn("No role row found for",user.email);}
  document.getElementById("roleBadge").innerText=currentRole==="admin"?"Full Admin":currentRole==="manager"?"Stock Manager":"Stock Operator";
  document.getElementById("userManagement").classList.toggle("hidden",!perms().canUsers);
  document.getElementById("addProductBtn").classList.toggle("hidden",!perms().canAdd);
  document.getElementById("rateHeader").classList.toggle("hidden",!perms().viewSensitive);
  document.getElementById("supplierHeader").classList.toggle("hidden",!perms().viewSensitive);
}
async function loadInventory(){const view=perms().viewSensitive?"inventory_admin_view":"inventory_staff_view";const {data,error}=await supabaseClient.from(view).select("*").eq("is_active",true).order("product_name",{ascending:true}).order("batch_no",{ascending:true});if(error){alert(error.message);return}inventory=data||[];populateFilters();renderInventory()}
function populateFilters(){
const ps=document.getElementById("productFilter"),bs=document.getElementById("batchFilter"),oldP=ps.value,oldB=bs.value;
const products=[...new Set(inventory.map(x=>(x.product_name||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
ps.innerHTML='<option value="">All Products</option>';
products.forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;ps.appendChild(o)});
if(products.includes(oldP))ps.value=oldP;
const batches=[...new Set(inventory.filter(x=>!ps.value||x.product_name===ps.value).map(x=>(x.batch_no||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
bs.innerHTML='<option value="">All Batches</option>';
batches.forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;bs.appendChild(o)});
if(batches.includes(oldB))bs.value=oldB;
}
function getFilteredInventory(){
const p=document.getElementById("productFilter").value,b=document.getElementById("batchFilter").value,d=document.getElementById("dateFilter").value,s=document.getElementById("stockFilter").value,q=document.getElementById("search").value.toLowerCase().trim();
return inventory.filter(i=>{const qty=Number(i.current_qty||0),reorder=Number(i.reorder_level||0);
if(p&&i.product_name!==p)return false;if(b&&i.batch_no!==b)return false;if(d&&i.entry_date!==d)return false;
if(s==="out"&&qty!==0)return false;if(s==="low"&&(qty===0||qty>reorder))return false;if(s==="in"&&qty<=0)return false;
if(q&&![(i.product_name||""),(i.batch_no||""),(i.supplier||""),(i.description||"")].join(" ").toLowerCase().includes(q))return false;return true;});
}
function renderInventory(){
const filtered=getFilteredInventory(),body=document.getElementById("inventoryBody");body.innerHTML="";
filtered.forEach(item=>{const row=document.createElement("tr"),qty=Number(item.current_qty||0),reorder=Number(item.reorder_level||0),status=qty===0?"Out of Stock":(qty<=reorder?"Low Stock":"In Stock");
row.innerHTML=`<td><strong>${escapeHtml(item.product_name)}</strong><br><small>${escapeHtml(item.description||"")}</small></td><td>${escapeHtml(item.batch_no||"-")}</td><td>${item.entry_date||""}</td><td>${item.expiry_date||"-"}</td><td><strong>${item.current_qty}</strong><br><small>${status}</small></td><td>${escapeHtml(item.unit||"")}</td><td class="rateCell ${perms().viewSensitive?"":"hidden"}">${perms().viewSensitive?"₹"+Number(item.rate||0).toLocaleString("en-IN"):""}</td><td>${item.gst_percent||0}%</td><td class="supplierCell ${perms().viewSensitive?"":"hidden"}">${perms().viewSensitive?escapeHtml(item.supplier||""):""}</td><td>${perms().canStock?`<button class="action-btn" onclick="openStock('${item.id}')">IN / OUT</button>`:""}${perms().canEdit?`<button class="action-btn gray" onclick="editProduct('${item.id}')">Edit</button>`:""}${perms().canDelete?`<button class="action-btn red" onclick="deleteProduct('${item.id}')">Delete</button>`:""}</td>`;
body.appendChild(row);});
document.getElementById("noData").style.display=filtered.length?"none":"block";
document.getElementById("filteredBatches").innerText=filtered.length;
document.getElementById("filteredStock").innerText=filtered.reduce((a,i)=>a+Number(i.current_qty||0),0);
document.getElementById("selectedProductSummary").innerText=document.getElementById("productFilter").value?document.getElementById("productFilter").value+" — all matching batches":"All products";
updateDashboard();
}
function updateDashboard(){document.getElementById("totalProducts").innerText=inventory.length;let total=0,low=0,expiring=0,today=new Date();today.setHours(0,0,0,0);let future=new Date(today);future.setDate(future.getDate()+30);inventory.forEach(item=>{total+=Number(item.current_qty||0);if(Number(item.current_qty||0)<=Number(item.reorder_level||0))low++;if(item.expiry_date){let expiry=new Date(item.expiry_date);if(expiry>=today&&expiry<=future)expiring++}});document.getElementById("totalStock").innerText=total;document.getElementById("lowStock").innerText=low;document.getElementById("expiring").innerText=expiring}

document.getElementById("addProductBtn").addEventListener("click",()=>openProductModal());
function openProductModal(item=null){document.getElementById("productModal").classList.remove("hidden");document.getElementById("rateField").classList.toggle("hidden",!perms().viewSensitive);document.getElementById("supplierField").classList.toggle("hidden",!perms().viewSensitive);document.getElementById("productMessage").innerText="";document.getElementById("modalTitle").innerText=item?"Edit Product":"Add Product";document.getElementById("productId").value=item?item.id:"";document.getElementById("productName").value=item?item.product_name:"";document.getElementById("description").value=item?item.description||"":"";document.getElementById("batchNo").value=item?item.batch_no:"";document.getElementById("entryDate").value=item?item.entry_date:new Date().toISOString().split("T")[0];document.getElementById("expiryDate").value=item?item.expiry_date||"":"";document.getElementById("currentQty").value=item?item.current_qty:0;document.getElementById("unit").value=item?item.unit:"Kit";document.getElementById("unitsPerPack").value=item?item.units_per_pack||"":"";document.getElementById("rate").value=item?item.rate||0:0;document.getElementById("gstPercent").value=item?item.gst_percent||0:0;document.getElementById("supplier").value=item?item.supplier||"":"";document.getElementById("reorderLevel").value=item?item.reorder_level||0:0}
document.getElementById("closeProductModal").onclick=document.getElementById("cancelProduct").onclick=()=>document.getElementById("productModal").classList.add("hidden");
document.getElementById("productForm").addEventListener("submit",async e=>{e.preventDefault();const id=document.getElementById("productId").value;const supplier=document.getElementById("supplier").value.trim();if(currentRole==="admin"&&!supplier){document.getElementById("productMessage").innerText="Supplier is mandatory for Full Admin.";return}const args={p_product_name:document.getElementById("productName").value.trim(),p_description:document.getElementById("description").value.trim()||null,p_batch_no:document.getElementById("batchNo").value.trim(),p_entry_date:document.getElementById("entryDate").value,p_expiry_date:document.getElementById("expiryDate").value||null,p_current_qty:Number(document.getElementById("currentQty").value),p_unit:document.getElementById("unit").value.trim(),p_units_per_pack:Number(document.getElementById("unitsPerPack").value||0),p_rate:Number(document.getElementById("rate").value||0),p_gst_percent:Number(document.getElementById("gstPercent").value||0),p_supplier:supplier,p_reorder_level:Number(document.getElementById("reorderLevel").value||0)};let result;if(id)result=await supabaseClient.rpc("inventory_update_product",{p_id:id,...args});else result=await supabaseClient.rpc("inventory_add_product",args);if(result.error){document.getElementById("productMessage").innerText=result.error.message;return}document.getElementById("productModal").classList.add("hidden");loadInventory()});
window.editProduct=id=>{const item=inventory.find(x=>x.id===id);if(item)openProductModal(item)};
window.deleteProduct=async id=>{if(!perms().canDelete){alert("Delete permission denied");return}if(!confirm("Is product ko permanently delete karna hai?"))return;const {error}=await supabaseClient.rpc("inventory_delete_product",{p_id:id});if(error){alert(error.message);return}loadInventory()};
window.openStock=id=>{selectedProduct=inventory.find(x=>x.id===id);if(!selectedProduct)return;document.getElementById("stockModal").classList.remove("hidden");document.getElementById("stockProductName").innerText=selectedProduct.product_name;document.getElementById("stockBatchName").innerText=selectedProduct.batch_no||"-";document.getElementById("currentStock").innerText=selectedProduct.current_qty;document.getElementById("movementQty").value="";document.getElementById("stockMessage").innerText=""};
async function stockMovement(type){if(!selectedProduct)return;const qty=Number(document.getElementById("movementQty").value),message=document.getElementById("stockMessage");if(!qty||qty<=0){message.innerText="Valid quantity enter karo.";return}const functionName=type==="IN"?"stock_in":"stock_out";const {data,error}=await supabaseClient.rpc(functionName,{p_inventory_id:selectedProduct.id,p_quantity:qty});if(error){message.innerText=error.message;return}message.classList.add("success");message.innerText="Stock updated. New stock: "+data;setTimeout(()=>{document.getElementById("stockModal").classList.add("hidden");message.classList.remove("success");loadInventory()},700)}
document.getElementById("inStock").onclick=()=>stockMovement("IN");document.getElementById("outStock").onclick=()=>stockMovement("OUT");document.getElementById("closeStockModal").onclick=document.getElementById("cancelStock").onclick=()=>document.getElementById("stockModal").classList.add("hidden");
const searchInput=document.getElementById("search"),suggestionsBox=document.getElementById("searchSuggestions");
function updateSearchSuggestions(){
  const q=searchInput.value.trim().toLowerCase();
  if(!q){suggestionsBox.classList.add("hidden");suggestionsBox.innerHTML="";return}
  const matches=inventory.filter(i=>{
    const text=[i.product_name||"",i.batch_no||"",i.description||""].join(" ").toLowerCase();
    return text.includes(q);
  }).slice(0,50);
  suggestionsBox.innerHTML="";
  if(!matches.length){suggestionsBox.innerHTML='<div class="search-suggestion">No matching product/batch</div>';suggestionsBox.classList.remove("hidden");return}
  matches.forEach(item=>{
    const d=document.createElement("div");
    d.className="search-suggestion";
    d.innerHTML=`<strong>${escapeHtml(item.product_name||"")}</strong><small>Batch/Lot: ${escapeHtml(item.batch_no||"-")} • Qty: ${escapeHtml(item.current_qty||0)}</small>`;
    d.onclick=()=>{
      document.getElementById("productFilter").value=item.product_name||"";
      populateFilters();
      document.getElementById("batchFilter").value=item.batch_no||"";
      searchInput.value="";
      suggestionsBox.classList.add("hidden");
      renderInventory();
    };
    suggestionsBox.appendChild(d);
  });
  suggestionsBox.classList.remove("hidden");
}
searchInput.addEventListener("input",()=>{updateSearchSuggestions();renderInventory()});
document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))suggestionsBox.classList.add("hidden")});

document.getElementById("productFilter").addEventListener("change",()=>{populateFilters();renderInventory()});
document.getElementById("batchFilter").addEventListener("change",renderInventory);
document.getElementById("dateFilter").addEventListener("change",renderInventory);
document.getElementById("stockFilter").addEventListener("change",renderInventory);
document.getElementById("clearFiltersBtn").addEventListener("click",()=>{document.getElementById("productFilter").value="";document.getElementById("batchFilter").innerHTML='<option value="">All Batches</option>';document.getElementById("dateFilter").value="";document.getElementById("stockFilter").value="";document.getElementById("search").value="";populateFilters();renderInventory();});
async function loadUsers(){if(!perms().canUsers)return;const {data,error}=await supabaseClient.from("inventory_user_roles").select("email,role").order("email");if(error){document.getElementById("userMessage").innerText=error.message;return}document.getElementById("usersBody").innerHTML=(data||[]).map(u=>`<tr><td>${escapeHtml(u.email||"")}</td><td>${escapeHtml(u.role)}</td></tr>`).join("")}
document.getElementById("saveRoleBtn").addEventListener("click",async()=>{const email=document.getElementById("roleEmail").value.trim(),role=document.getElementById("roleSelect").value,msg=document.getElementById("userMessage");msg.innerText="";if(!email){msg.innerText="Email enter karo.";return}const {error}=await supabaseClient.rpc("admin_set_inventory_role",{p_email:email,p_role:role});if(error){msg.innerText=error.message;return}msg.className="message success";msg.innerText="Role updated.";document.getElementById("roleEmail").value="";loadUsers()});
function escapeHtml(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}checkSession();
</script>
</body>
</html>
