<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Micron Lab Inventory Admin</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="login" class="center"><div class="card login"><h1>Micron Lab</h1><p>Inventory Admin</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="loginMsg"></p></div></div>
<div id="app" class="hidden"><header><div><b>Micron Lab</b> <span>Inventory Admin</span></div><button id="logout" class="gray">Logout</button></header><main>
<div class="stats"><div class="stat"><small>Products</small><b id="products">0</b></div><div class="stat"><small>Total Stock</small><b id="stock">0</b></div><div class="stat"><small>Low Stock</small><b id="low">0</b></div><div class="stat"><small>Expiring Soon</small><b id="exp">0</b></div></div>
<div class="toolbar"><input id="search" placeholder="Search product / batch"><button id="add">+ Add Product</button></div>
<div class="card table"><table><thead><tr><th>Product</th><th>Batch</th><th>Entry</th><th>Expiry</th><th>Stock</th><th>Unit</th><th>Rate</th><th>GST</th><th>Actions</th></tr></thead><tbody id="body"></tbody></table><div id="empty">No inventory records.</div></div>
</main></div>
<div id="productModal" class="modal hidden"><div class="card modalbox"><div class="head"><h2 id="mtitle">Add Product</h2><button class="x" id="close">×</button></div><form id="form"><input type="hidden" id="id"><label>Product Name*<input id="name" required></label><label>Description<input id="desc"></label><div class="grid"><label>Batch No.*<input id="batch" required></label><label>Entry Date*<input id="entry" type="date" required></label><label>Expiry Date<input id="expiry" type="date"></label><label>Current Qty*<input id="qty" type="number" min="0" step=".01" required></label><label>Unit*<input id="unit" value="Kit" required></label><label>Units per Pack<input id="pack" type="number" min="0" step=".01"></label><label>Rate<input id="rate" type="number" min="0" step=".01"></label><label>GST %<input id="gst" type="number" min="0" max="100" step=".01"></label><label>Supplier<input id="supplier"></label><label>Reorder Level<input id="reorder" type="number" min="0" step=".01"></label></div><div class="actions"><button type="button" class="gray" id="cancel">Cancel</button><button>Save</button></div><p id="formMsg"></p></form></div></div>
<div id="moveModal" class="modal hidden"><div class="card modalbox small"><div class="head"><h2 id="moveTitle">Stock</h2><button class="x" id="moveClose">×</button></div><p>Current stock: <b id="current">0</b></p><label>Quantity<input id="moveQty" type="number" min=".01" step=".01"></label><div class="actions"><button class="gray" id="moveCancel">Cancel</button><button class="danger" id="out">OUT</button><button id="in">IN</button></div><p id="moveMsg"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
