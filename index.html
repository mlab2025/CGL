<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micron Lab - Inventory Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}
.hidden{display:none!important}

header{
    height:65px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}
header h2{margin:0}
header span{color:#64748b}

.container{
    max-width:1400px;
    margin:auto;
    padding:25px;
}

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:14px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.login-card{
    width:390px;
    padding:30px;
}

input,select{
    width:100%;
    padding:11px;
    margin:6px 0 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:14px;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    background:#2563eb;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button.gray{
    background:#e2e8f0;
    color:#1e293b;
}

button.red{
    background:#dc2626;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:18px;
}

.stat small{
    color:#64748b;
}

.stat strong{
    display:block;
    font-size:28px;
    margin-top:8px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.toolbar input{
    max-width:450px;
}

.table-card{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #edf2f7;
    text-align:left;
    font-size:13px;
}

th{
    background:#f8fafc;
}

.action-btn{
    padding:6px 9px;
    font-size:12px;
    margin:2px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:100;
}

.modal-box{
    width:700px;
    max-width:100%;
    max-height:92vh;
    overflow:auto;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 15px;
}

.message{
    margin-top:10px;
    color:#dc2626;
    font-size:13px;
}

.success{
    color:#15803d;
}

@media(max-width:800px){
    .stats{
        grid-template-columns:1fr 1fr;
    }

    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">

    <div class="card login-card">

        <h2>Micron Lab</h2>
        <p>Inventory Admin Panel</p>

        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="Admin Email">

        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Password">

        <button id="loginBtn" style="width:100%;">
            Login
        </button>

        <div id="loginMessage" class="message"></div>

    </div>

</div>


<!-- ADMIN -->
<div id="adminPage" class="hidden">

<header>

    <div>
        <h2>Micron Lab</h2>
        <span>Inventory Admin</span>
    </div>

    <button id="logoutBtn" class="gray">
        Logout
    </button>

</header>


<div class="container">

<!-- DASHBOARD -->

<div class="stats">

    <div class="stat">
        <small>Total Products</small>
        <strong id="totalProducts">0</strong>
    </div>

    <div class="stat">
        <small>Total Stock</small>
        <strong id="totalStock">0</strong>
    </div>

    <div class="stat">
        <small>Low Stock</small>
        <strong id="lowStock">0</strong>
    </div>

    <div class="stat">
        <small>Expiring Soon</small>
        <strong id="expiring">0</strong>
    </div>

</div>


<!-- TOOLBAR -->

<div class="toolbar">

    <input
        id="search"
        type="text"
        placeholder="Search product / batch / supplier"
    >

    <button id="addProductBtn">
        + Add Product
    </button>

</div>


<!-- TABLE -->

<div class="card table-card">

<table>

<thead>

<tr>
<th>Product</th>
<th>Batch No.</th>
<th>Entry Date</th>
<th>Expiry</th>
<th>Current Qty</th>
<th>Unit</th>
<th>Rate</th>
<th>GST</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="inventoryBody"></tbody>

</table>

<div id="noData"
style="text-align:center;padding:30px;color:#64748b;">
No inventory found.
</div>

</div>

</div>

</div>


<!-- PRODUCT MODAL -->

<div id="productModal" class="modal hidden">

<div class="card modal-box">

<div class="modal-header">

<h2 id="modalTitle">
Add Product
</h2>

<button
id="closeProductModal"
class="gray">
×
</button>

</div>


<form id="productForm">

<input type="hidden" id="productId">


<div class="grid">

<div>

<label>Product Name *</label>
<input id="productName" required>

</div>


<div>

<label>Description</label>
<input id="description">

</div>


<div>

<label>Batch No. *</label>
<input id="batchNo" required>

</div>


<div>

<label>Entry Date *</label>
<input id="entryDate" type="date" required>

</div>


<div>

<label>Expiry Date</label>
<input id="expiryDate" type="date">

</div>


<div>

<label>Current Qty *</label>
<input id="currentQty" type="number" min="0" step="0.01" required>

</div>


<div>

<label>Unit *</label>
<input id="unit" value="Kit" required>

</div>


<div>

<label>Units per Pack</label>
<input id="unitsPerPack" type="number" min="0">

</div>


<div>

<label>Rate</label>
<input id="rate" type="number" min="0" step="0.01">

</div>


<div>

<label>GST %</label>
<input id="gstPercent" type="number" min="0" max="100" step="0.01">

</div>


<div>

<label>Supplier</label>
<input id="supplier">

</div>


<div>

<label>Reorder Level</label>
<input id="reorderLevel" type="number" min="0">

</div>

</div>


<div style="text-align:right;margin-top:15px;">

<button
type="button"
id="cancelProduct"
class="gray">
Cancel
</button>

<button type="submit">
Save Product
</button>

</div>


<div id="productMessage" class="message"></div>

</form>

</div>

</div>


<!-- IN OUT MODAL -->

<div id="stockModal" class="modal hidden">

<div class="card modal-box" style="max-width:420px;">

<div class="modal-header">

<h2 id="stockProductName">
Stock
</h2>

<button
id="closeStockModal"
class="gray">
×
</button>

</div>


<p>
Current Stock:
<strong id="currentStock">
0
</strong>
</p>


<label>
Quantity
</label>

<input
id="movementQty"
type="number"
min="0.01"
step="0.01"
placeholder="Enter quantity"
>


<div style="display:flex;gap:10px;justify-content:flex-end;">

<button
id="cancelStock"
class="gray">
Cancel
</button>

<button
id="outStock"
class="red">
OUT
</button>

<button
id="inStock">
IN
</button>

</div>


<div id="stockMessage" class="message"></div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://xldnayhoquadguepedqm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_EPC6EEnO2EEvcIQFtozteA_XTKMyPx1";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let inventory = [];
let selectedProduct = null;


// ================================
// LOGIN
// ================================

document
.getElementById("loginBtn")
.addEventListener("click", async function(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

const message =
document.getElementById("loginMessage");

message.innerText = "";

if(!email || !password){

message.innerText =
"Email aur password enter karo.";

return;

}


const {data,error} =
await supabaseClient.auth.signInWithPassword({

email:email,
password:password

});


if(error){

message.innerText =
error.message;

return;

}


showAdmin();

});


// ================================
// SESSION
// ================================

async function checkSession(){

const {data} =
await supabaseClient.auth.getSession();

if(data.session){

showAdmin();

}else{

showLogin();

}

}


function showLogin(){

document
.getElementById("loginPage")
.classList.remove("hidden");

document
.getElementById("adminPage")
.classList.add("hidden");

}


function showAdmin(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("adminPage")
.classList.remove("hidden");

loadInventory();

}


supabaseClient.auth.onAuthStateChange(
function(event,session){

if(session){

showAdmin();

}else{

showLogin();

}

});


// ================================
// LOGOUT
// ================================

document
.getElementById("logoutBtn")
.addEventListener("click",async function(){

await supabaseClient.auth.signOut();

});


// ================================
// LOAD INVENTORY
// ================================

async function loadInventory(){

const {data,error} =
await supabaseClient
.from("inventory_stock")
.select("*")
.eq("is_active",true)
.order("product_name",{ascending:true});


if(error){

alert(error.message);

return;

}

inventory = data || [];

renderInventory();

}


// ================================
// RENDER
// ================================

function renderInventory(){

const search =
document
.getElementById("search")
.value
.toLowerCase();


const filtered =
inventory.filter(function(item){

return (

(item.product_name || "")
.toLowerCase()
.includes(search)

||

(item.batch_no || "")
.toLowerCase()
.includes(search)

||

(item.supplier || "")
.toLowerCase()
.includes(search)

);

});


const body =
document.getElementById("inventoryBody");


body.innerHTML = "";


filtered.forEach(function(item){

const row =
document.createElement("tr");


row.innerHTML = `

<td>
<strong>${escapeHtml(item.product_name)}</strong>
<br>
<small>${escapeHtml(item.description || "")}</small>
</td>

<td>${escapeHtml(item.batch_no)}</td>

<td>${item.entry_date || ""}</td>

<td>${item.expiry_date || "-"}</td>

<td>
<strong>${item.current_qty}</strong>
</td>

<td>${escapeHtml(item.unit)}</td>

<td>₹${Number(item.rate || 0).toLocaleString("en-IN")}</td>

<td>${item.gst_percent || 0}%</td>

<td>

<button
class="action-btn"
onclick="openStock('${item.id}')">
IN / OUT
</button>

<button
class="action-btn gray"
onclick="editProduct('${item.id}')">
Edit
</button>

<button
class="action-btn red"
onclick="deleteProduct('${item.id}')">
Delete
</button>

</td>

`;

body.appendChild(row);

});


document
.getElementById("noData")
.style.display =
filtered.length ? "none" : "block";


updateDashboard();

}


// ================================
// DASHBOARD
// ================================

function updateDashboard(){

document
.getElementById("totalProducts")
.innerText =
inventory.length;


let total = 0;

let low = 0;

let expiring = 0;


const today =
new Date();


const future =
new Date();

future.setDate(
future.getDate() + 30
);


inventory.forEach(function(item){

total += Number(item.current_qty || 0);


if(
Number(item.current_qty || 0)
<=
Number(item.reorder_level || 0)
){

low++;

}


if(item.expiry_date){

const expiry =
new Date(item.expiry_date);

if(
expiry >= today &&
expiry <= future
){

expiring++;

}

}

});


document
.getElementById("totalStock")
.innerText =
total;


document
.getElementById("lowStock")
.innerText =
low;


document
.getElementById("expiring")
.innerText =
expiring;

}


// ================================
// ADD PRODUCT
// ================================

document
.getElementById("addProductBtn")
.addEventListener("click",function(){

openProductModal();

});


function openProductModal(item=null){

document
.getElementById("productModal")
.classList.remove("hidden");


document
.getElementById("productMessage")
.innerText = "";


document
.getElementById("modalTitle")
.innerText =
item ? "Edit Product" : "Add Product";


document
.getElementById("productId")
.value =
item ? item.id : "";


document
.getElementById("productName")
.value =
item ? item.product_name : "";


document
.getElementById("description")
.value =
item ? item.description || "" : "";


document
.getElementById("batchNo")
.value =
item ? item.batch_no : "";


document
.getElementById("entryDate")
.value =
item
? item.entry_date
: new Date().toISOString().split("T")[0];


document
.getElementById("expiryDate")
.value =
item ? item.expiry_date || "" : "";


document
.getElementById("currentQty")
.value =
item ? item.current_qty : 0;


document
.getElementById("unit")
.value =
item ? item.unit : "Kit";


document
.getElementById("unitsPerPack")
.value =
item ? item.units_per_pack || "" : "";


document
.getElementById("rate")
.value =
item ? item.rate || 0 : 0;


document
.getElementById("gstPercent")
.value =
item ? item.gst_percent || 0 : 0;


document
.getElementById("supplier")
.value =
item ? item.supplier || "" : "";


document
.getElementById("reorderLevel")
.value =
item ? item.reorder_level || 0 : 0;

}


document
.getElementById("closeProductModal")
.onclick =
document.getElementById("cancelProduct")
.onclick =
function(){

document
.getElementById("productModal")
.classList.add("hidden");

};


// ================================
// SAVE PRODUCT
// ================================

document
.getElementById("productForm")
.addEventListener("submit",async function(e){

e.preventDefault();


const id =
document.getElementById("productId").value;


const product = {

product_name:
document.getElementById("productName").value.trim(),

description:
document.getElementById("description").value.trim() || null,

batch_no:
document.getElementById("batchNo").value.trim(),

entry_date:
document.getElementById("entryDate").value,

expiry_date:
document.getElementById("expiryDate").value || null,

current_qty:
Number(document.getElementById("currentQty").value),

unit:
document.getElementById("unit").value.trim(),

units_per_pack:
Number(document.getElementById("unitsPerPack").value || 0),

rate:
Number(document.getElementById("rate").value || 0),

gst_percent:
Number(document.getElementById("gstPercent").value || 0),

supplier:
document.getElementById("supplier").value.trim() || null,

reorder_level:
Number(document.getElementById("reorderLevel").value || 0),

is_active:true

};


let result;


if(id){

result =
await supabaseClient
.from("inventory_stock")
.update(product)
.eq("id",id);

}else{

result =
await supabaseClient
.from("inventory_stock")
.insert(product);

}


if(result.error){

document
.getElementById("productMessage")
.innerText =
result.error.message;

return;

}


document
.getElementById("productModal")
.classList.add("hidden");


loadInventory();

});


// ================================
// EDIT
// ================================

window.editProduct =
function(id){

const item =
inventory.find(x=>x.id===id);

if(item){

openProductModal(item);

}

};


// ================================
// DELETE
// ================================

window.deleteProduct =
async function(id){

if(!confirm(
"Is product ko permanently delete karna hai?"
)){

return;

}


const {error} =
await supabaseClient
.from("inventory_stock")
.delete()
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadInventory();

};


// ================================
// IN / OUT
// ================================

window.openStock =
function(id){

selectedProduct =
inventory.find(x=>x.id===id);


if(!selectedProduct){

return;

}


document
.getElementById("stockModal")
.classList.remove("hidden");


document
.getElementById("stockProductName")
.innerText =
selectedProduct.product_name;


document
.getElementById("currentStock")
.innerText =
selectedProduct.current_qty;


document
.getElementById("movementQty")
.value = "";


document
.getElementById("stockMessage")
.innerText = "";

};


async function stockMovement(type){

if(!selectedProduct){

return;

}


const qty =
Number(
document
.getElementById("movementQty")
.value
);


if(!qty || qty <= 0){

document
.getElementById("stockMessage")
.innerText =
"Valid quantity enter karo.";

return;

}


const functionName =
type === "IN"
? "stock_in"
: "stock_out";


const {data,error} =
await supabaseClient.rpc(
functionName,
{
p_inventory_id:
selectedProduct.id,

p_quantity:qty
}
);


if(error){

document
.getElementById("stockMessage")
.innerText =
error.message;

return;

}


document
.getElementById("stockMessage")
.classList.add("success");


document
.getElementById("stockMessage")
.innerText =
"Stock updated. New stock: " + data;


setTimeout(function(){

document
.getElementById("stockModal")
.classList.add("hidden");

loadInventory();

},700);

}


document
.getElementById("inStock")
.onclick =
function(){

stockMovement("IN");

};


document
.getElementById("outStock")
.onclick =
function(){

stockMovement("OUT");

};


document
.getElementById("closeStockModal")
.onclick =
document.getElementById("cancelStock")
.onclick =
function(){

document
.getElementById("stockModal")
.classList.add("hidden");

};


// ================================
// SEARCH
// ================================

document
.getElementById("search")
.addEventListener("input",function(){

renderInventory();

});


// ================================
// ESCAPE HTML
// ================================

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


// START
checkSession();

</script>

</body>
</html>
